name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  # Compute a lowercase repo name once and share it
  prep:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.lower.outputs.image_name }}
    steps:
      - name: Lowercase repo
        id: lower
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-main-image:
    needs: [prep]
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      image_name: ${{ needs.prep.outputs.image_name }}
      cache_id: main

  build-cuda-image:
    needs: [prep]
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      image_name: ${{ needs.prep.outputs.image_name }}
      cache_id: cuda
      image_tag: type=raw,enable=${{ github.ref == 'refs/heads/main' }},prefix=,suffix=,value=cuda
      extract_flavor: suffix=-cuda,onlatest=true
      build_args: |
        USE_CUDA=true

  build-minimum-image:
    needs: [prep]
    uses: ./.github/workflows/build-docker-image.yaml
    with:
      image_name: ${{ needs.prep.outputs.image_name }}
      cache_id: minimum
      image_tag: type=raw,enable=${{ github.ref == 'refs/heads/main' }},prefix=,suffix=,value=minimum
      extract_flavor: suffix=-minimum,onlatest=true
      build_args: |
        MINIMUM_BUILD=true

  merge-main-images:
    needs: [prep, build-main-image]
    uses: ./.github/workflows/merge-docker-images.yaml
    with:
      image_name: ${{ needs.prep.outputs.image_name }}
      cache_id: main

  merge-cuda-images:
    needs: [prep, build-cuda-image]
    uses: ./.github/workflows/merge-docker-images.yaml
    with:
      image_name: ${{ needs.prep.outputs.image_name }}
      cache_id: cuda
      extract_flavor: suffix=-cuda,onlatest=true
      extract_tags: type=raw,enable=${{ github.ref == 'refs/heads/main' }},prefix=,suffix=,value=cuda

  merge-minimum-images:
    needs: [prep, build-minimum-image]
    uses: ./.github/workflows/merge-docker-images.yaml
    with:
      image_name: ${{ needs.prep.outputs.image_name }}
      cache_id: minimum
      extract_flavor: suffix=-minimum,onlatest=true
      extract_tags: type=raw,enable=${{ github.ref == 'refs/heads/main' }},prefix=,suffix=,value=minimum
